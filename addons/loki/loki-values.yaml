# The chart's values schema rejects unknown top-level keys, and the MinIO
# subchart was removed in 20.0, so there is no minio block here. Storage is
# the S3 config above.

backend:
 replicas: 0
read:
 replicas: 0
write:
 replicas: 0

singleBinary:
 replicas: 0

# The ServiceMonitor relabels job to loki/<service> and adds app_instance=loki
# (chart 18 renamed that label from cluster). Dashboards, rules, and alerts
# from the chart stay off; Grafana provisions dashboards/loki-logs.json from
# the kube-prometheus-stack add-on instead.
monitoring:
  serviceMonitor:
    enabled: true

# Kubernetes NetworkPolicy on both clusters (Cilium enforces it too). The
# chart's CiliumNetworkPolicy flavor was removed in 15.0.
# Port 443 with no cidr allows S3 and the EKS API. DNS, gateway ingress, and
# metrics ingress come from the chart. The chart alertmanager rule only
# selects the backend target, which this install does not run, so the ruler
# allow is an extra manifest below.
networkPolicy:
  enabled: true
  externalStorage:
    ports:
      - 443

extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: loki-ruler-alertmanager
      namespace: loki
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
          app.kubernetes.io/instance: loki
          app.kubernetes.io/component: ruler
      policyTypes:
        - Egress
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: alertmanager
          ports:
            - port: 9093
              protocol: TCP
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: loki-dns-all
      namespace: loki
    spec:
      podSelector: {}
      policyTypes:
        - Egress
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
          ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: loki-ingress-monitoring
      namespace: loki
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: loki-ingress-otel-demo
      namespace: loki
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
          app.kubernetes.io/instance: loki
          app.kubernetes.io/component: gateway
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: otel-demo
          ports:
            - port: 8080
              protocol: TCP

