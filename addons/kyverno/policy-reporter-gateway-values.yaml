# Policy Reporter (Cilium cluster): ingress stays off. kyverno/init.sh applies
# policy-reporter-gateway-route.yaml (ListenerSet + HTTPRoute) after this
# file. Same workload settings as policy-reporter-values.yaml; Helm does not
# merge the two files.

ui:
  enabled: true
  ingress:
    enabled: false
  # Same reason as values.yaml: the chart's UI policy emits an empty from.
  networkPolicy:
    enabled: false

plugin:
  kyverno:
    enabled: true
    networkPolicy:
      enabled: true
      ingress:
        - ports:
            - protocol: TCP
              port: 8080
      egress:
        - ports:
            - protocol: TCP
              port: 443
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53

monitoring:
  enabled: true
  grafana:
    dashboards:
      enabled: false

networkPolicy:
  enabled: true
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
