crds:
  enabled: true
# Chart defaults allow metrics and health from any source, and egress to
# 80, 443, and DNS. 443 covers the EKS API and ACME.
networkPolicy:
  enabled: true
webhook:
  networkPolicy:
    enabled: true
cainjector:
  networkPolicy:
    enabled: true
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  # enableGatewayAPI: true

# cert-manager v1.21.3: prometheus.servicemonitor (lowercase).
# PodMonitor and ServiceMonitor are mutually exclusive in this chart.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true