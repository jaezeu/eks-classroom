# Dashboards for the standard cluster only. ingress-nginx is not installed
# on the Cilium cluster.
grafana:
  dashboards:
    network:
      # ingress-nginx chart 4.15.1
      ingress-nginx:
        url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/helm-chart-4.15.1/deploy/grafana/dashboards/nginx.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      ingress-nginx-request-handling:
        url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/helm-chart-4.15.1/deploy/grafana/dashboards/request-handling-performance.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
