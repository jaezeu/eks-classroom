# Dashboards for the Cilium cluster only. These components are not installed
# on the standard cluster.
grafana:
  dashboards:
    network:
      # Cilium chart 1.20.0-pre.4
      cilium-agent:
        url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0-pre.4/install/kubernetes/cilium/files/cilium-agent/dashboards/cilium-dashboard.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      cilium-operator:
        url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0-pre.4/install/kubernetes/cilium/files/cilium-operator/dashboards/cilium-operator-dashboard.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      hubble:
        url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0-pre.4/install/kubernetes/cilium/files/hubble/dashboards/hubble-dashboard.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      hubble-dns:
        url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0-pre.4/install/kubernetes/cilium/files/hubble/dashboards/hubble-dns-namespace.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      hubble-network:
        url: https://raw.githubusercontent.com/cilium/cilium/v1.20.0-pre.4/install/kubernetes/cilium/files/hubble/dashboards/hubble-network-overview-namespace.json
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      keda: 
        gnetId: 23951
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
    security:
      # Tetragon publishes metrics but no dashboard of its own. 25789 is the
      # Prometheus dashboard on grafana.com.
      tetragon:
        gnetId: 25789
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
