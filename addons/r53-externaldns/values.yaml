provider:
  name: aws
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: ${EXTERNAL_DNS_ROLE_ARN}  # The external-dns role ARN
env:
  - name: AWS_DEFAULT_REGION
    value: ${REGION} # change to region where EKS is installed
policy: sync # Default is upsert-only
txtOwnerId: ${CLUSTER_NAME} # e.g. shared-eks-cluster
sources:
  - ingress
  - service
  # - gateway-httproute
  # - gateway-tlsroute
logLevel: info #[panic, debug, info, warning, error, fatal]
logFormat: text # text / json

# external-dns 1.23.0 scrapes the http Service (:7979 /metrics).
serviceMonitor:
  enabled: true
# external-dns 0.22 (chart 1.22) switched the default annotation prefix to
# external-dns.kubernetes.io/ with no fallback. Every hostname annotation in
# this repo still uses the alpha prefix, so keep reading that one.
annotationPrefix: external-dns.alpha.kubernetes.io/
