# keda 2.21.0. Installed into monitoring with Prometheus.
# ServiceMonitors for the operator, the metrics apiserver, and the admission
# webhooks. Empty namespace would also land in the release namespace; set it
# so the rendered objects are in monitoring. Prometheus selects every
# ServiceMonitor, so these carry no extra labels.
# cert-manager stays off. The chart generates its own webhook certificates.

prometheus:
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
  webhooks:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

certificates:
  autoGenerated: true
  certManager:
    enabled: false

# Kubernetes flavor on the standard cluster. The Cilium workflow merges
# networkpolicy-cilium.yaml, which sets flavor to cilium. The chart renders
# one flavor, not both.
# Chart Kubernetes rules already allow CoreDNS (k8s-app=kube-dns, any
# namespace, UDP and TCP 53), all ports to every pod, and TCP 443 plus 6443
# to every pod. That 443/6443 rule does not reach the EKS API, which is not
# a pod and listens on 443. extraEgressRules adds TCP 443 with no destination
# peer. NetworkPolicy cannot select that endpoint. The rule is not an ipBlock
# cidr, and it does allow 443 to any address, which is what makes the API
# reachable. 6443 is not added here.
networkPolicy:
  enabled: true
  flavor: kubernetes
  kubernetes:
    operator:
      extraEgressRules:
        - ports:
            - protocol: TCP
              port: 443
    metricsServer:
      extraEgressRules:
        - ports:
            - protocol: TCP
              port: 443
    webhooks:
      extraEgressRules:
        - ports:
            - protocol: TCP
              port: 443

# Chart ingress rules select pods, so they miss the API server and the
# kubelet. They also omit probe port 8081. These policies are Ingress only,
# with no from selector, and apply on both clusters. Cilium unions them with
# the CiliumNetworkPolicy when that flavor is selected.
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: keda-operator-ingress
      namespace: monitoring
    spec:
      podSelector:
        matchLabels:
          app: keda-operator
      policyTypes:
        - Ingress
      ingress:
        - ports:
            - protocol: TCP
              port: 8081
            - protocol: TCP
              port: 8080
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: keda-metrics-apiserver-ingress
      namespace: monitoring
    spec:
      podSelector:
        matchLabels:
          app: keda-operator-metrics-apiserver
      policyTypes:
        - Ingress
      ingress:
        - ports:
            - protocol: TCP
              port: 6443
            - protocol: TCP
              port: 8080
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: keda-admission-webhooks-ingress
      namespace: monitoring
    spec:
      podSelector:
        matchLabels:
          app: keda-admission-webhooks
      policyTypes:
        - Ingress
      ingress:
        - ports:
            - protocol: TCP
              port: 9443
            - protocol: TCP
              port: 8081
            - protocol: TCP
              port: 8080
