# This workflow creates the EKS cluster and deploy the addons as specified in the inputs
name: Cilium CNI Cluster Creation & Bootstrap

on:
  workflow_dispatch:
    inputs:
      region:
        type: choice
        options:
          - ap-southeast-1
          - us-east-1
        description: "AWS region"
        required: true
        default: ap-southeast-1
      external-dns:
        type: boolean
        description: "Deploy ExternalDNS?"
        default: false
        required: true
      cert-manager:
        type: boolean
        description: "Deploy CertManager?"
        default: false
        required: true
      staging-certs:
        type: boolean
        description: "Use the Let's Encrypt staging directory? (untrusted certs; keeps rehearsals off the production quota)"
        default: false
        required: true
      argocd:
        type: boolean
        description: "Deploy ArgoCD?"
        default: false
        required: true
      monitoring:
        type: boolean
        description: "Deploy Prometheus and Grafana?"
        default: false
        required: true
      metrics-server:
        type: boolean
        description: "Deploy Metrics Server?"
        default: false
        required: true
      keda:
        type: boolean
        description: "Deploy KEDA?"
        default: false
        required: true
      logging:
        type: boolean
        description: "Deploy Loki?"
        default: false
        required: true
      tetragon:
        type: boolean
        description: "Deploy Tetragon?"
        default: false
        required: true
      ebs-csi:
        type: boolean
        description: "Deploy EBS CSI Resources?"
        default: false
        required: true
      trivy-operator:
        type: boolean
        description: "Deploy Trivy Operator?"
        default: false
        required: true
      kyverno:
        type: boolean
        description: "Deploy Kyverno & guardrail policies?"
        default: false
        required: true
      opentelemetry-demo:
        type: boolean
        description: "Deploy the OpenTelemetry demo? Needs Prometheus and Loki. Uses m6g.xlarge nodes."
        default: false
        required: true
  # Mirrors the dispatch inputs so the rehearsal workflow can call this
  # workflow. github.event.inputs is empty under workflow_call, which is why
  # the jobs below use the typed inputs.* context everywhere.
  workflow_call:
    inputs:
      region:
        type: string
        default: ap-southeast-1
      external-dns:
        type: boolean
        default: false
      cert-manager:
        type: boolean
        default: false
      staging-certs:
        type: boolean
        default: false
      argocd:
        type: boolean
        default: false
      monitoring:
        type: boolean
        default: false
      metrics-server:
        type: boolean
        default: false
      keda:
        type: boolean
        default: false
      logging:
        type: boolean
        default: false
      tetragon:
        type: boolean
        default: false
      ebs-csi:
        type: boolean
        default: false
      trivy-operator:
        type: boolean
        default: false
      kyverno:
        type: boolean
        default: false
      opentelemetry-demo:
        type: boolean
        default: false

permissions:
  id-token: write       # Required for OIDC
  contents: read        # To read repo content

env:
  ACCOUNT_ID: ${{ vars.ACCOUNT_ID }}
  OIDC_ROLE: arn:aws:iam::${{ vars.ACCOUNT_ID }}:role/EKSPlatformDeployerRole
  # renovate: datasource=github-releases depName=hashicorp/terraform
  TERRAFORM_VERSION: 1.15.8
  WORKSPACE: cilium-cluster-${{ inputs.region }}

jobs:
  deploy:
    name: Create Cluster
    runs-on: ubuntu-latest
    outputs:
      cluster_name: ${{ steps.deploy_steps.outputs.CLUSTER_NAME }}
      external_dns_role_arn: ${{ steps.deploy_steps.outputs.EXTERNAL_DNS_ROLE_ARN }}
      loki_s3_role_arn: ${{ steps.deploy_steps.outputs.LOKI_S3_ROLE_ARN }}
      loki_chunks_bucket: ${{ steps.deploy_steps.outputs.LOKI_CHUNKS_BUCKET }}
      loki_ruler_bucket: ${{ steps.deploy_steps.outputs.LOKI_RULER_BUCKET }}
      ebs_csi_role_arn: ${{ steps.deploy_steps.outputs.EBS_CSI_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
        
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/eks-cluster

      - name: Terraform Workspace Setup
        run: |
          terraform workspace select ${{ env.WORKSPACE }} || terraform workspace new ${{ env.WORKSPACE }}
          terraform workspace list
        working-directory: ./terraform/eks-cluster

      - name: Deploy Cluster
        id: deploy_steps
        env:
          # Terraform reads TF_VAR_* as variable values. The OpenTelemetry demo
          # needs the larger node type; everything else keeps the default.
          TF_VAR_node_instance_types: ${{ inputs.opentelemetry-demo && '["m6g.xlarge"]' || '["m6g.large"]' }}
        run: |
          echo "Creating cluster with no node group"
          terraform plan -var-file=vars/cilium-wo-nodegroup.tfvars -out=cilium-cluster-wo-nodegroups.out
          terraform apply -auto-approve cilium-cluster-wo-nodegroups.out

          CLUSTER_NAME=$(terraform output -raw cluster_name)
          CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint)
          export CLUSTER_NAME CLUSTER_ENDPOINT

          aws eks update-kubeconfig --name "$CLUSTER_NAME"

          echo "Adding Gateway API v1.5.1 standard-channel CRDs (per Cilium docs; TLSRoute and ListenerSet are standard as of v1.5)"
          kubectl apply \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_gatewayclasses.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_gateways.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_referencegrants.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_grpcroutes.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_backendtlspolicies.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_listenersets.yaml \
            -f https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.5.1/config/crd/standard/gateway.networking.k8s.io_tlsroutes.yaml

          echo "Installing Prometheus Operator CRDs (ServiceMonitor) so add-on charts can render their monitors before the monitoring stack exists"
          ../../addons/kube-prometheus-stack/install-crds.sh

          echo "Installing Cilium CNI"
          pushd ../../addons/cilium
          # shellcheck disable=SC2016  # literal ${VAR} names are envsubst syntax, not shell
          envsubst '${CLUSTER_ENDPOINT}' < values.yaml > updated-values.yaml
          mv updated-values.yaml values.yaml
          ./init.sh
          popd

          echo "Creating cluster with node group"
          terraform plan -var-file=vars/cilium-with-nodegroup.tfvars -out=cilium-cluster-with-nodegroups.out
          terraform apply -auto-approve cilium-cluster-with-nodegroups.out

          {
            echo "CLUSTER_NAME=$CLUSTER_NAME"
            echo "EXTERNAL_DNS_ROLE_ARN=$(terraform output -json external_dns_role_arn | jq -r '.[0]')"
            echo "LOKI_S3_ROLE_ARN=$(terraform output -json loki_s3_role_arn | jq -r '.[0]')"
            echo "LOKI_CHUNKS_BUCKET=$(terraform output -json loki_chunks_bucket_name | jq -r '.[0]')"
            echo "LOKI_RULER_BUCKET=$(terraform output -json loki_ruler_bucket_name | jq -r '.[0]')"
            echo "EBS_CSI_ROLE_ARN=$(terraform output -json ebs_csi_driver_role_arn | jq -r '.[0]')"
          } >> "$GITHUB_OUTPUT"
        working-directory: ./terraform/eks-cluster

      # Install the cilium CLI on the runner (amd64; runs on the runner, not the ARM nodes).
      - name: Install Cilium CLI
        env:
          # renovate: datasource=github-releases depName=cilium/cilium-cli
          CILIUM_CLI_VERSION: v0.18.7
        run: |
          curl -L --fail --remote-name-all "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-amd64.tar.gz"{,.sha256sum}
          sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
          sudo tar xzvfC cilium-linux-amd64.tar.gz /usr/local/bin
          rm cilium-linux-amd64.tar.gz{,.sha256sum}

      # Fail the deploy job (so bootstrap never runs on a broken cluster) unless
      # Cilium is healthy and every node has reached Ready.
      - name: Smoke test - Cilium healthy & nodes Ready
        run: |
          aws eks update-kubeconfig --name ${{ steps.deploy_steps.outputs.CLUSTER_NAME }}
          cilium status --wait
          kubectl wait --for=condition=Ready nodes --all --timeout=60s

  bootstrap:
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ inputs.region }}
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ needs.deploy.outputs.cluster_name }}

      # Shared Cilium Gateway (Gateway API). The GatewayClass "cilium" and the
      # Gateway API CRDs are created in the deploy job; this creates the single
      # shared Gateway that per-add-on ListenerSets + HTTPRoutes attach to.
      - name: Deploy Cilium Shared Gateway
        working-directory: addons/cilium/gateway
        run: |
          kubectl apply -f namespace.yml
          kubectl apply -f shared-gateway.yml
          kubectl apply -f hubble-ui-route.yaml

      - name: Deploy ExternalDNS for Route53
        if: ${{ inputs.external-dns }}
        working-directory: addons/r53-externaldns
        env:
          REGION: ${{ inputs.region }}
          EXTERNAL_DNS_ROLE_ARN: ${{ needs.deploy.outputs.external_dns_role_arn }}
          CLUSTER_NAME: ${{ needs.deploy.outputs.cluster_name }}
        run: |
          envsubst < gateway-values.yaml > updated-values.yaml
          mv updated-values.yaml gateway-values.yaml
          ./init.sh gateway-values.yaml

      - name: Deploy Cert Manager
        if: ${{ inputs.cert-manager }}
        working-directory: addons/cert-manager
        env:
          EMAIL: ${{ secrets.EMAIL_ADDRESS }}
          # init.sh substitutes both into the ClusterIssuer before applying it.
          ACME_SERVER: ${{ inputs.staging-certs && 'https://acme-staging-v02.api.letsencrypt.org/directory' || 'https://acme-v02.api.letsencrypt.org/directory' }}
        run: ./init.sh gateway-values.yaml gateway-cluster-issuer.yaml

      - name: Deploy ArgoCD
        if: ${{ inputs.argocd }}
        working-directory: addons/argocd
        run: |
          ./init.sh gateway-values.yaml
          kubectl apply -f gateway-route.yaml

      - name: Deploy Prometheus and Grafana
        if: ${{ inputs.monitoring }}
        working-directory: addons/kube-prometheus-stack
        run: |
          ./init.sh gateway-values.yaml
          kubectl apply -f gateway-route.yaml

      - name: Deploy Loki
        if: ${{ inputs.logging }}
        working-directory: addons/loki
        env:
          REGION: ${{ inputs.region }}
          LOKI_S3_ROLE_ARN: ${{ needs.deploy.outputs.loki_s3_role_arn }}
          LOKI_CHUNKS_BUCKET: ${{ needs.deploy.outputs.loki_chunks_bucket }}
          LOKI_RULER_BUCKET: ${{ needs.deploy.outputs.loki_ruler_bucket }}
        run: |
          # shellcheck disable=SC2016  # literal ${VAR} names are envsubst syntax, not shell
          envsubst '${REGION} ${LOKI_S3_ROLE_ARN} ${LOKI_CHUNKS_BUCKET} ${LOKI_RULER_BUCKET}' < loki-values.yaml > updated-values.yaml
          mv updated-values.yaml loki-values.yaml
          ./init.sh cilium

      - name: Deploy Tetragon
        if: ${{ inputs.tetragon }}
        working-directory: addons/cilium/tetragon
        run: ./init.sh

      - name: Deploy EBS CSI Driver Resources
        if: ${{ inputs.ebs-csi }}
        working-directory: addons/ebs-csi-driver
        env:
          EBS_CSI_ROLE_ARN: ${{ needs.deploy.outputs.ebs_csi_role_arn }}
        run: |
          # shellcheck disable=SC2016  # literal ${VAR} names are envsubst syntax, not shell
          envsubst '${EBS_CSI_ROLE_ARN}' < values.yaml > updated-values.yaml
          mv updated-values.yaml values.yaml
          ./init.sh

      # kube-system already exists, so the namespace-name policy does not apply.
      - name: Deploy Metrics Server
        if: ${{ inputs.metrics-server }}
        working-directory: addons/metrics-server
        run: ./init.sh

      # Installs into monitoring (shared with Prometheus when that is on).
      - name: Deploy KEDA
        if: ${{ inputs.keda }}
        working-directory: addons/keda
        run: ./init.sh cilium

      # Trivy before Kyverno: the namespace-name policy would reject trivy-system.
      - name: Deploy Trivy Operator
        if: ${{ inputs.trivy-operator }}
        working-directory: addons/trivy-operator
        run: ./init.sh

      # Before Kyverno: the namespace-name policy would reject otel-demo.
      # Needs Prometheus and Loki.
      # The deploy job uses m6g.xlarge when this option is on.
      - name: Deploy OpenTelemetry demo
        if: ${{ inputs.opentelemetry-demo }}
        working-directory: addons/opentelemetry-demo
        run: ./init.sh

      # Kyverno is last among namespace-creating installs. Its init.sh also
      # installs Policy Reporter into the kyverno namespace (gateway variant).
      - name: Deploy Kyverno, Guardrail Policies & Policy Reporter
        if: ${{ inputs.kyverno }}
        working-directory: addons/kyverno
        run: ./init.sh gateway

  verify:
    name: Verify Platform
    runs-on: ubuntu-latest
    needs: [deploy, bootstrap]
    timeout-minutes: 30
    env:
      EXTERNAL_DNS: ${{ inputs.external-dns }}
      CERT_MANAGER: ${{ inputs.cert-manager }}
      STAGING_CERTS: ${{ inputs.staging-certs }}
      ARGOCD: ${{ inputs.argocd }}
      MONITORING: ${{ inputs.monitoring }}
      KEDA: ${{ inputs.keda }}
      LOGGING: ${{ inputs.logging }}
      TRIVY_OPERATOR: ${{ inputs.trivy-operator }}
      KYVERNO: ${{ inputs.kyverno }}
      OTEL_DEMO: ${{ inputs.opentelemetry-demo }}

    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.OIDC_ROLE }}
          aws-region: ${{ inputs.region }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ needs.deploy.outputs.cluster_name }}

      - name: Platform workloads healthy
        run: |
          NAMESPACES="kube-system"
          [ "$EXTERNAL_DNS" = "true" ] && NAMESPACES="$NAMESPACES external-dns"
          [ "$CERT_MANAGER" = "true" ] && NAMESPACES="$NAMESPACES cert-manager"
          [ "$ARGOCD" = "true" ]       && NAMESPACES="$NAMESPACES argocd"
          { [ "$MONITORING" = "true" ] || [ "$KEDA" = "true" ]; } && NAMESPACES="$NAMESPACES monitoring"
          [ "$LOGGING" = "true" ]      && NAMESPACES="$NAMESPACES loki"
          [ "$TRIVY_OPERATOR" = "true" ] && NAMESPACES="$NAMESPACES trivy-system"
          [ "$KYVERNO" = "true" ]       && NAMESPACES="$NAMESPACES kyverno"
          [ "$OTEL_DEMO" = "true" ]    && NAMESPACES="$NAMESPACES otel-demo"
          for ns in $NAMESPACES; do
            echo "--- $ns"
            RESOURCES=$(kubectl get deploy,statefulset,daemonset -n "$ns" -o name)
            [ -n "$RESOURCES" ] || { echo "no workloads found in $ns"; exit 1; }
            for r in $RESOURCES; do
              kubectl rollout status "$r" -n "$ns" --timeout=3m
            done
          done

      - name: Kyverno guardrail policies ready
        if: ${{ inputs.kyverno }}
        run: kubectl wait --for=condition=Ready clusterpolicy --all --timeout=3m

      - name: Shared Gateway programmed
        run: kubectl wait --for=condition=Programmed gateway/shared-gateway -n gateway --timeout=3m

      - name: TLS certificates issued & listeners programmed
        if: ${{ inputs.cert-manager && inputs.external-dns }}
        run: |
          NAMESPACES="kube-system"
          [ "$ARGOCD" = "true" ]          && NAMESPACES="$NAMESPACES argocd"
          [ "$MONITORING" = "true" ]      && NAMESPACES="$NAMESPACES monitoring"
          [ "$KYVERNO" = "true" ]         && NAMESPACES="$NAMESPACES kyverno"
          for ns in $NAMESPACES; do
            kubectl wait --for=condition=Ready certificate --all -n "$ns" --timeout=10m
            kubectl wait --for=condition=Programmed listenerset --all -n "$ns" --timeout=2m
          done

      - name: Platform UIs reachable over HTTPS
        if: ${{ inputs.cert-manager && inputs.external-dns }}
        run: |
          URLS="https://gateway-hubble.sctp-sandbox.com"
          [ "$ARGOCD" = "true" ]          && URLS="$URLS https://gateway-argocd.sctp-sandbox.com"
          [ "$MONITORING" = "true" ]      && URLS="$URLS https://gateway-admin-prom.sctp-sandbox.com https://gateway-admin-grafana.sctp-sandbox.com"
          [ "$KYVERNO" = "true" ]         && URLS="$URLS https://gateway-policy-reporter.sctp-sandbox.com"
          # Staging certificates chain to an untrusted root; -k keeps the
          # check meaningful (-f still requires a 2xx/3xx from the backend).
          CURL_OPTS=()
          [ "$STAGING_CERTS" = "true" ] && CURL_OPTS+=(-k)
          for url in $URLS; do
            curl "${CURL_OPTS[@]}" -sSfL -o /dev/null --connect-timeout 15 --retry 10 --retry-delay 15 --retry-all-errors "$url"
            echo "OK  $url"
          done

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          kubectl get pods -A || true
          kubectl get httproute -A || true
          kubectl describe gateway,listenerset -A || true
          kubectl describe certificate -A || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 50 || true
