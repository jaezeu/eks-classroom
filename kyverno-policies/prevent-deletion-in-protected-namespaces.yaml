apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prevent-deletion-in-protected-namespaces
spec:
  validationFailureAction: Enforce
  background: false
  # Explicit kinds, not "*": a wildcard registers the webhook for every
  # resource in the cluster, including large cluster-scoped objects such as
  # the kube-prometheus-stack CRDs, and the admission controller then times
  # out ("context deadline exceeded") under a class-sized burst of installs.
  # 30s (the maximum) buffers the remaining calls.
  webhookTimeoutSeconds: 30
  rules:
    - name: block-resource-deletion
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
                - Service
                - ConfigMap
                - Secret
                - Ingress
                - PersistentVolumeClaim
                - ServiceAccount
                - HorizontalPodAutoscaler
                - NetworkPolicy
                - Role
                - RoleBinding
              namespaces:
                - kube-system
                - ingress-nginx
                - cert-manager
                - external-dns
                - argocd
                - kyverno
              operations:
                - DELETE
      # Guardrail for humans only: in-cluster controllers must stay able to manage resource lifecycles, or rollouts and cert issuance in these namespaces.
      # The pipeline's deployer role is also excluded: helm pre-upgrade hooks delete and recreate their resources, so re-running bootstrap would otherwise be blocked.
      exclude:
        any:
          - subjects:
              - kind: Group
                name: system:serviceaccounts
          - subjects:
              - kind: User
                name: "arn:aws:sts::*:assumed-role/EKSPlatformDeployerRole/*"
      validate:
        message: "Deleting resources in protected namespaces is not allowed."
        deny: {}
